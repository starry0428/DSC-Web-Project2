<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>루비 문자 학습</title>
    <style>
        * {
            margin: 0xp;
            padding: 0px;
            box-sizing: border-box;
        }

        rt {
            color: black;
            font-weight: bold;
            background-color: chocolate;
        }
    </style>
</head>

<body>
    <h1>루비 문자(Ruby Text)</h1>
    <p>
        한자 예시:
        韓한 子자
    </p>
    <p>
        한글 예시:
        청출어람 靑出於藍(푸른색은 쪽에서 나왔지만 족빛보다 더 푸르다)
    </p>
    <p>
        일본어 예시:
        學生 がくせいです
    </p>

    <hr />

    <p>
        한자 예시:
        <ruby>韓<rt>한</rt> 子<rt>자</rt></ruby>
    </p>
    <p>
        한글 예시:
        <ruby>청출어람 <rt>靑出於藍</rt></ruby>(푸른색은 쪽에서 나왔지만 족빛보다 더 푸르다)
    </p>
    <p>
        일본어 예시:
        <ruby>學生 <rt>がくせいです</rt></ruby>
    </p>
</body>

</html>
